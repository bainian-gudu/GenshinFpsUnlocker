cargo-features = ["profile-rustflags", "trim-paths"]
[package]
name = "kachina-installer"
version = "0.1.0"
description = "Unified installer and upgrader"
authors = ["YuehaiTeam"]
edition = "2021"
default-run = "kachina-installer"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = [
    "wry",
    "devtools",
] }
tauri-utils = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
async-compression = { version = "0.4", features = ["tokio", "zstd", "zstdmt"] }
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "fs",
    "io-util",
    "process",
    "macros",
    "net",
] }
chksum-md5 = { version = "0.1", features = ["async-runtime-tokio"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
    "http2",
    "json",
    "native-tls",
    "native-tls-alpn",
    "charset",
    "gzip",
    "zstd",
    "stream",
    "system-proxy"
] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["io-util"] }
async-walkdir = "2.0"
windows = { version = "0.61.1", features = [
    "Win32_System_Console",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Security",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "UI_ViewManagement",
] }

rfd = { version = "0.15", default-features = false, features = [
    "tokio",
    "common-controls-v6",
] }
nt_version = "0.1"
lazy_static = "1.5"
open = { version = "5.3.1", features = ["shellexecute-on-windows"] }
mslnk = "=0.1"
twox-hash = "2.1.0"
pin-project = "1.1.7"
fmmap = { version = "0.4", features = ["tokio"] }
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4.39"
uuid = { version = "1.16", features = ["v4"] }
hpatch-sys = { path = "./libs/hpatch-sys" }
hdiff-sys = { path = "./libs/hdiff-sys" }
ignore = "0.4.23"
num_cpus = "1.16.0"
indicatif = { version = "0.17.9", features = ["tokio"] }
console = "0.15.10"
# 本地改动：原为 git 依赖，改用仓库内 vendored 副本（理由见 ../vendor/rcedit-rs/LOCAL_PATCHES.md）
rcedit = { version = "0.1.0", path = "../vendor/rcedit-rs" }
windows-registry = "0.5"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }
zip = { git = "https://github.com/xytoki/zip2.git", default-features = false, features = [
    "deflate",
    "deflate64",
    "zstd",
] }
anyhow = "1.0"
reqwest-middleware = { version = "0.4", features = ["json"] }
tracing = "0.1"
win32-version-info = "0.2.0"
multer = "3.1.0"
bytes = "1.10.1"
url = "2.5"
base64 = "0.22.1"
h3 = "0.0.8"
h3-msquic-async = { version = "0.3", default-features = false, features = ["msquic-seera", "msquic-seera-static", "tracing"] }
hex = "0.4"
async-trait = "0.1"
async-stream = "0.3"
http = "1"
russh = { version="0.54.5", default-features = false, features= ["aws-lc-rs","flate2"] }
russh-sftp = "2"
ssh-key = "0.6"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[[bin]]
name = "kachina-installer"
path = "src/main.rs"

[[bin]]
name = "kachina-builder"
path = "src/builder/main.rs"

[profile.dev]
incremental = true # 将编译拆成更小的步骤。
rustflags = ["-Zthreads=16"] # 提高编译性能。

[profile.release]
debug = true
split-debuginfo = "packed"
codegen-units = 1 # 允许 LLVM 进行更好的优化。
lto = true # 启用链接时优化。
opt-level = "s" # 优先减小二进制体积；更重视速度时可改为 `3`。
panic = "abort" # 禁用 panic 处理器以提高性能。
trim-paths = "all" # 从二进制文件中移除可能包含特权信息的路径。
rustflags = ["-Zthreads=16"] # 提高编译性能。

[patch.crates-io]
msquic-async = { git = "https://github.com/xytoki/msquic-async-rs.git", branch = "main" }
ctor = { git = "https://github.com/xytoki/rust-ctor.git", branch = "master" }
