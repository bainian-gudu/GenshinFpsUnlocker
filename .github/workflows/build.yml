name: Build

# 仅手动触发，不在 push / PR / release 时自动跑
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      host_mode:
        description: "Host publish mode"
        required: true
        default: "framework-dependent"
        type: choice
        options:
          - framework-dependent
          - self-contained
      rebuild_kachina:
        description: "强制从 installer/kachina 源码重建 kachina-builder（忽略缓存）"
        required: false
        default: false
        type: boolean

env:
  DOTNET_VERSION: "9.0.x"
  NODE_VERSION: "22"
  # 上游 kachina-installer 固定用 nightly + -Z build-std
  RUST_TOOLCHAIN: "nightly"
  # 避免 runner 上 SDK 10 抢先解析 csproj（仍以 global.json rollForward 为准）
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CARGO_TERM_COLOR: "always"
  # 这两个变量都是为了压掉第三方 action 自己的告警，理由见
  # installer/README.md「workflow 里那些看着多余的设置」
  NODE_NO_WARNINGS: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ---------------------------------------------------------------------------
  # 项目内 kachina-installer 源码 → kachina-builder.exe
  # 不再从上游 Release 下载二进制（robinraju/release-downloader 已移除）
  # ---------------------------------------------------------------------------
  build-kachina:
    name: Kachina builder (from installer/kachina)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5


      # 源码没变就直接复用上次的产物（Rust LTO + build-std + 静态 msquic 冷构建很慢）
      - name: Cache kachina-builder.exe
        if: ${{ !inputs.rebuild_kachina }}
        id: kachina-cache
        uses: actions/cache@v4
        with:
          path: installer/tools/kachina-builder.exe
          key: kachina-builder-${{ runner.os }}-${{ hashFiles('installer/kachina/**') }}

      # 长路径 + 下面的 CMAKE_GENERATOR: Ninja 是同一件事的两道防线（FTK1011），
      # 详见 installer/README.md「workflow 里那些看着多余的设置」
      - name: Enable Windows long paths
        if: steps.kachina-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $key = "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem"
          New-ItemProperty -Path $key -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force |
            Out-Null
          "LongPathsEnabled = " + (Get-ItemProperty -Path $key).LongPathsEnabled

      - name: Install Rust nightly + rust-src
        if: steps.kachina-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup component add rust-src --toolchain $env:RUST_TOOLCHAIN
          rustc --version; cargo --version

      - name: Cache cargo / target
        if: steps.kachina-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "installer/kachina/src-tauri"
          cache-targets: true
          key: kachina-src

      - name: Setup pnpm
        if: steps.kachina-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v4
        with:
          # 仓库根目录没有 package.json；版本号（pnpm@10.17.0）从上游快照的
          # packageManager 字段读取
          package_json_file: installer/kachina/package.json

      - name: Setup Node.js
        if: steps.kachina-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: installer/kachina/pnpm-lock.yaml

      # Ninja 生成器不会像 MSBuild 那样自己去 VS 安装目录找 cl.exe，
      # 必须先把 MSVC 开发环境注入 PATH / INCLUDE / LIB。
      - name: Add MSVC Developer environment
        if: steps.kachina-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build kachina-builder from source
        if: steps.kachina-cache.outputs.cache-hit != 'true'
        env:
          # cmake-rs 会读取 CMAKE_GENERATOR；Ninja 不写 .tlog，绕开 FTK1011（见 README）
          CMAKE_GENERATOR: Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          "CMAKE_GENERATOR = $env:CMAKE_GENERATOR"
          & cmake --version | Select-Object -First 1
          & ninja --version
          & .\installer\build-kachina.ps1 -Toolchain $env:RUST_TOOLCHAIN
          if (-not (Test-Path "installer\tools\kachina-builder.exe")) {
            throw "kachina-builder.exe 未生成"
          }
          Get-Item installer\tools\kachina-builder.exe |
            Select-Object FullName, @{n = "MB"; e = { [math]::Round($_.Length / 1MB, 2) }} |
            Format-List

      - name: Upload kachina-builder
        uses: actions/upload-artifact@v6
        with:
          name: kachina-builder
          path: installer/tools/kachina-builder.exe
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 应用本体：Web UI + FpsUnlockerStub.dll + Host
  # ---------------------------------------------------------------------------
  build-app:
    name: App (UI + stub + host)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/Ui/package-lock.json

      - name: Add MSVC Developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build stub + host
        shell: pwsh
        env:
          CONFIGURATION: ${{ inputs.configuration }}
          HOST_MODE: ${{ inputs.host_mode }}
        run: |
          $ErrorActionPreference = "Stop"
          # 勿用 $args（PowerShell 自动变量）；改用 hashtable splat
          $buildParams = @{
            Configuration = $env:CONFIGURATION
            SkipSetup     = $true
          }
          if ($env:HOST_MODE -eq "self-contained") {
            $buildParams.SelfContained = $true
          }
          Write-Host "build.ps1 params: $($buildParams | ConvertTo-Json -Compress)"
          & .\build.ps1 @buildParams
          if (-not (Test-Path "dist\GenshinFpsUnlocker.exe")) { throw "Host exe missing" }
          if (-not (Test-Path "dist\FpsUnlockerStub.dll")) { throw "Stub dll missing" }
          if (-not (Test-Path "dist\ui\index.html")) { throw "Web UI missing under dist\ui\" }

          $hasCore = (Test-Path "dist\coreclr.dll") -or (Test-Path "dist\hostfxr.dll")
          if ($env:HOST_MODE -eq "self-contained") {
            if (-not $hasCore) { Write-Warning "SC host missing coreclr/hostfxr" }
          } else {
            if ($hasCore) { Write-Warning "FDD host unexpectedly contains coreclr/hostfxr" }
            else { Write-Host "FDD host OK (no bundled runtime)" }
          }
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload dist
        uses: actions/upload-artifact@v6
        with:
          name: app-dist
          path: dist/**
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 打包：调用项目内的 kachina-builder（installer/pack.ps1）
  # ---------------------------------------------------------------------------
  pack:
    name: Pack Kachina installer
    runs-on: windows-latest
    needs: [build-kachina, build-app]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download kachina-builder
        uses: actions/download-artifact@v6
        with:
          name: kachina-builder
          path: installer/tools

      - name: Download app dist
        uses: actions/download-artifact@v6
        with:
          name: app-dist
          path: dist

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $raw = Get-Content "src\Host\GenshinFpsUnlocker.Host.csproj" -Raw
          if ($raw -match "<Version>([^<]+)</Version>") {
            "version=$($Matches[1].Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "version=1.0.0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "installer\tools\kachina-builder.exe")) { throw "kachina-builder.exe missing" }
          if (-not (Test-Path "dist\GenshinFpsUnlocker.exe")) { throw "dist payload missing" }
          & .\installer\pack.ps1 -SkipKachinaBuild -Version "${{ steps.ver.outputs.version }}"
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: GenshinFpsUnlocker-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.7z
            artifacts/*.Install.*.exe
          if-no-files-found: error
          retention-days: 30
