name: Build

# 仅手动触发，不在 push / PR / release 时自动跑
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      self_contained:
        description: "Also build self-contained setup package"
        required: true
        default: true
        type: boolean

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add MSVC Developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (stub + host + setup)
        shell: pwsh
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          $ErrorActionPreference = "Stop"
          .\build.ps1 -Configuration $env:CONFIGURATION -SelfContained:$false
          if (-not (Test-Path "dist\GenshinFpsUnlocker.exe")) {
            throw "Host exe missing"
          }
          if (-not (Test-Path "dist\FpsUnlockerStub.dll")) {
            throw "Stub dll missing"
          }
          if (-not (Test-Path "dist\Setup\GenshinFpsUnlocker.Setup.exe")) {
            throw "Setup exe missing"
          }
          Get-ChildItem dist -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Pack portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $portableDir = Join-Path $out "GenshinFpsUnlocker-portable-win-x64"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Get-ChildItem dist -Force | Where-Object { $_.Name -ne "Setup" } | ForEach-Object {
            Copy-Item $_.FullName $portableDir -Recurse -Force
          }
          Compress-Archive -Path $portableDir -DestinationPath (Join-Path $out "GenshinFpsUnlocker-portable-win-x64.zip") -Force

          $setupDir = Join-Path $out "GenshinFpsUnlocker-setup-win-x64"
          New-Item -ItemType Directory -Force -Path $setupDir | Out-Null
          Copy-Item "dist\Setup\*" $setupDir -Recurse -Force
          Compress-Archive -Path $setupDir -DestinationPath (Join-Path $out "GenshinFpsUnlocker-setup-win-x64.zip") -Force

          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GenshinFpsUnlocker-win-x64
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30

  build-self-contained:
    name: Windows x64 (self-contained)
    runs-on: windows-latest
    permissions:
      contents: read
    if: ${{ inputs.self_contained }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add MSVC Developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build self-contained
        shell: pwsh
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          $ErrorActionPreference = "Stop"
          .\build.ps1 -Configuration $env:CONFIGURATION -SelfContained
          if (-not (Test-Path "dist\Setup\GenshinFpsUnlocker.Setup.exe")) {
            throw "Setup exe missing"
          }

      - name: Pack self-contained setup zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $setupDir = Join-Path $out "GenshinFpsUnlocker-setup-sc-win-x64"
          New-Item -ItemType Directory -Force -Path $setupDir | Out-Null
          Copy-Item "dist\Setup\*" $setupDir -Recurse -Force
          Compress-Archive -Path $setupDir -DestinationPath (Join-Path $out "GenshinFpsUnlocker-setup-sc-win-x64.zip") -Force
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload self-contained artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenshinFpsUnlocker-setup-sc-win-x64
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30
