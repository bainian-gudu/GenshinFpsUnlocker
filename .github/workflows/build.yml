name: Build

# 仅手动触发，不在 push / PR / release 时自动跑
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      host_mode:
        description: "Host publish mode (setup always self-contained)"
        required: true
        default: "framework-dependent"
        type: choice
        options:
          - framework-dependent
          - self-contained

env:
  DOTNET_VERSION: "9.0.x"

jobs:
  build-windows:
    name: Windows x64 (host FDD + setup SC)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add MSVC Developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (stub + host + setup)
        shell: pwsh
        env:
          CONFIGURATION: ${{ inputs.configuration }}
          HOST_MODE: ${{ inputs.host_mode }}
        run: |
          $ErrorActionPreference = "Stop"
          $args = @("-Configuration", $env:CONFIGURATION)
          if ($env:HOST_MODE -eq "self-contained") {
            $args += "-SelfContained"
          }
          .\build.ps1 @args
          if (-not (Test-Path "dist\GenshinFpsUnlocker.exe")) { throw "Host exe missing" }
          if (-not (Test-Path "dist\FpsUnlockerStub.dll")) { throw "Stub dll missing" }
          if (-not (Test-Path "dist\Setup\GenshinFpsUnlocker.Setup.exe")) { throw "Setup exe missing" }

          # 默认 FDD：不应带 coreclr；SC 模式应带
          $hasCore = (Test-Path "dist\coreclr.dll") -or (Test-Path "dist\hostfxr.dll")
          if ($env:HOST_MODE -eq "self-contained") {
            if (-not $hasCore) { Write-Warning "SC host missing coreclr/hostfxr" }
          } else {
            if ($hasCore) { Write-Warning "FDD host unexpectedly contains coreclr/hostfxr" }
            else { Write-Host "FDD host OK (no bundled runtime)" }
          }
          # Setup 始终 SC
          if (-not (Test-Path "dist\Setup\coreclr.dll") -and -not (Test-Path "dist\Setup\hostfxr.dll")) {
            Write-Warning "Setup missing coreclr/hostfxr — verify self-contained setup"
          }
          Get-ChildItem dist -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Pack zip artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $portableDir = Join-Path $out "GenshinFpsUnlocker-portable-win-x64"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Get-ChildItem dist -Force | Where-Object { $_.Name -ne "Setup" } | ForEach-Object {
            Copy-Item $_.FullName $portableDir -Recurse -Force
          }
          Compress-Archive -Path $portableDir -DestinationPath (Join-Path $out "GenshinFpsUnlocker-portable-win-x64.zip") -Force

          $setupDir = Join-Path $out "GenshinFpsUnlocker-setup-win-x64"
          New-Item -ItemType Directory -Force -Path $setupDir | Out-Null
          Copy-Item "dist\Setup\*" $setupDir -Recurse -Force
          Compress-Archive -Path $setupDir -DestinationPath (Join-Path $out "GenshinFpsUnlocker-setup-win-x64.zip") -Force

          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GenshinFpsUnlocker-win-x64
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30
