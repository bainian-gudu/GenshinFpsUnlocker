name: Build

# 仅手动触发，不在 push / PR / release 时自动跑
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      host_mode:
        description: "Host publish mode"
        required: true
        default: "framework-dependent"
        type: choice
        options:
          - framework-dependent
          - self-contained

env:
  DOTNET_VERSION: "9.0.x"

jobs:
  build-windows:
    name: Windows x64 (host + MicaSetup)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add MSVC Developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build stub + host
        shell: pwsh
        env:
          CONFIGURATION: ${{ inputs.configuration }}
          HOST_MODE: ${{ inputs.host_mode }}
        run: |
          $ErrorActionPreference = "Stop"
          $args = @("-Configuration", $env:CONFIGURATION, "-SkipSetup")
          if ($env:HOST_MODE -eq "self-contained") {
            $args += "-SelfContained"
          }
          .\build.ps1 @args
          if (-not (Test-Path "dist\GenshinFpsUnlocker.exe")) { throw "Host exe missing" }
          if (-not (Test-Path "dist\FpsUnlockerStub.dll")) { throw "Stub dll missing" }

          $hasCore = (Test-Path "dist\coreclr.dll") -or (Test-Path "dist\hostfxr.dll")
          if ($env:HOST_MODE -eq "self-contained") {
            if (-not $hasCore) { Write-Warning "SC host missing coreclr/hostfxr" }
          } else {
            if ($hasCore) { Write-Warning "FDD host unexpectedly contains coreclr/hostfxr" }
            else { Write-Host "FDD host OK (no bundled runtime)" }
          }
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $raw = Get-Content "src\Host\GenshinFpsUnlocker.Host.csproj" -Raw
          if ($raw -match "<Version>([^<]+)</Version>") {
            "version=$($Matches[1].Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "version=1.0.0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Pack publish.7z
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if (Test-Path publish.7z) { Remove-Item publish.7z -Force }
          # 载荷 = dist 全部应用文件
          7z a -t7z "publish.7z" ".\dist\*" -mx=5 -mf=BCJ2 -r -y
          Copy-Item publish.7z "artifacts\GenshinFpsUnlocker_v$ver.7z" -Force
          # 便携 zip（便于无 7z 用户）
          $portableDir = "artifacts\GenshinFpsUnlocker-portable-win-x64"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "dist\*" $portableDir -Recurse -Force
          Compress-Archive -Path $portableDir -DestinationPath "artifacts\GenshinFpsUnlocker-portable-win-x64.zip" -Force

      - name: Download MicaSetup
        uses: robinraju/release-downloader@v1.8
        with:
          repository: "lemutec/MicaSetup"
          latest: true
          fileName: "MicaSetup_v*.7z"

      - name: Build MicaSetup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "${{ steps.ver.outputs.version }}"

          $archiveFiles = Get-ChildItem -Path . -Filter "MicaSetup_v*.7z"
          if (-not $archiveFiles) { throw "MicaSetup archive not downloaded" }
          foreach ($archive in $archiveFiles) {
            & 7z x $archive.FullName -y
          }
          if (-not (Test-Path "makemica.exe")) { throw "makemica.exe missing after extract" }

          # makemica 读取相对路径：Package=./publish.7z，图标 ./micasetup/...
          Copy-Item -Path "Build\micasetup.json" -Destination ".\micasetup.json" -Force
          if (Test-Path ".\micasetup") { Remove-Item ".\micasetup" -Recurse -Force }
          Copy-Item -Path "Build\micasetup" -Destination ".\micasetup" -Recurse -Force
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" ".\LICENSE" -Force }

          # publish.7z 已在仓库根（上一步）
          if (-not (Test-Path "publish.7z")) { throw "publish.7z missing" }

          .\makemica.exe micasetup.json
          if ($LASTEXITCODE -ne 0) { throw "makemica failed" }

          $setup = "GenshinFpsUnlocker_Setup.exe"
          if (-not (Test-Path $setup)) {
            $setup = Get-ChildItem -Filter "*Setup*.exe" -File |
              Where-Object { $_.Name -notmatch "makemica|MicaSetup" } |
              Select-Object -First 1 -ExpandProperty Name
          }
          if (-not $setup -or -not (Test-Path $setup)) { throw "Setup exe not produced" }

          $outName = "GenshinFpsUnlocker_Setup_v$ver.exe"
          Move-Item -Path $setup -Destination "artifacts\$outName" -Force
          Write-Host "Produced artifacts\$outName"
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GenshinFpsUnlocker-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.7z
            artifacts/*_Setup_v*.exe
          if-no-files-found: error
          retention-days: 30
