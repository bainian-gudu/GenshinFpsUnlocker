name: Build

# 仅手动触发，不在 push / PR / release 时自动跑
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      host_mode:
        description: "Host publish mode"
        required: true
        default: "framework-dependent"
        type: choice
        options:
          - framework-dependent
          - self-contained

env:
  DOTNET_VERSION: "9.0.x"
  # 避免 runner 上 SDK 10 抢先解析 csproj（仍以 global.json rollForward 为准）
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # 第三方 action 若仍声明 node20，强制落到 runner 默认 Node 24，消减弃用告警
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    name: Windows x64 (host + Kachina)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Ui/package-lock.json

      - name: Add MSVC Developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build stub + host
        shell: pwsh
        env:
          CONFIGURATION: ${{ inputs.configuration }}
          HOST_MODE: ${{ inputs.host_mode }}
        run: |
          $ErrorActionPreference = "Stop"
          # 勿用 $args（PowerShell 自动变量）；改用 hashtable splat
          $buildParams = @{
            Configuration = $env:CONFIGURATION
            SkipSetup     = $true
          }
          if ($env:HOST_MODE -eq "self-contained") {
            $buildParams.SelfContained = $true
          }
          Write-Host "build.ps1 params: $($buildParams | ConvertTo-Json -Compress)"
          & .\build.ps1 @buildParams
          if (-not (Test-Path "dist\GenshinFpsUnlocker.exe")) { throw "Host exe missing" }
          if (-not (Test-Path "dist\FpsUnlockerStub.dll")) { throw "Stub dll missing" }
          if (-not (Test-Path "dist\ui\index.html")) { throw "Web UI missing under dist\ui\" }

          $hasCore = (Test-Path "dist\coreclr.dll") -or (Test-Path "dist\hostfxr.dll")
          if ($env:HOST_MODE -eq "self-contained") {
            if (-not $hasCore) { Write-Warning "SC host missing coreclr/hostfxr" }
          } else {
            if ($hasCore) { Write-Warning "FDD host unexpectedly contains coreclr/hostfxr" }
            else { Write-Host "FDD host OK (no bundled runtime)" }
          }
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $raw = Get-Content "src\Host\GenshinFpsUnlocker.Host.csproj" -Raw
          if ($raw -match "<Version>([^<]+)</Version>") {
            "version=$($Matches[1].Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "version=1.0.0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Download kachina-builder
        uses: robinraju/release-downloader@v1.13
        with:
          repository: "YuehaiTeam/kachina-installer"
          latest: true
          fileName: "kachina-builder.exe"

      - name: Pack Kachina installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "${{ steps.ver.outputs.version }}"
          $app = "GenshinFpsUnlocker"
          if (-not (Test-Path ".\kachina-builder.exe")) { throw "kachina-builder.exe missing" }

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # 与 stub 一样避开 Build/（Windows 大小写不敏感）；Kachina 配置仍读 Build\kachina.config.json
          $work = "out\kachina-ci"
          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          $appDir = Join-Path $work $app
          New-Item -ItemType Directory -Force -Path $appDir | Out-Null
          Copy-Item "dist\*" $appDir -Recurse -Force
          if (Test-Path "USER_AGREEMENT.txt") {
            Copy-Item "USER_AGREEMENT.txt" (Join-Path $appDir "USER_AGREEMENT.txt") -Force
          }

          $config = "Build\kachina.config.json"
          $updater = Join-Path $appDir "$app.update.exe"
          Write-Host "==> pack updater"
          .\kachina-builder.exe pack -c $config -o $updater
          if ($LASTEXITCODE -ne 0) { throw "pack updater failed" }

          Write-Host "==> gen metadata"
          Push-Location $work
          try {
            ..\..\kachina-builder.exe gen -j 6 -i $app -m metadata.json -o hashed `
              -r bainian-gudu/GenshinFpsUnlocker -t $ver -u ".\$app\$app.update.exe"
            if ($LASTEXITCODE -ne 0) { throw "gen failed" }

            $installName = "$app.Install.$ver.exe"
            Write-Host "==> pack offline install $installName"
            ..\..\kachina-builder.exe pack -c ..\..\Build\kachina.config.json `
              -m metadata.json -d hashed -o $installName
            if ($LASTEXITCODE -ne 0) { throw "pack install failed" }

            Copy-Item $installName "..\..\artifacts\$installName" -Force
          } finally {
            Pop-Location
          }

          # 便携 zip（含 update.exe）
          $portableDir = "artifacts\$app-portable-win-x64"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "$work\$app\*" $portableDir -Recurse -Force
          Compress-Archive -Path $portableDir -DestinationPath "artifacts\$app-portable-win-x64.zip" -Force

          # 便携 7z
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -t7z "artifacts\${app}_v$ver.7z" "$work\$app" -mx=5 -mf=BCJ2 -r -y
          }

          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: GenshinFpsUnlocker-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.7z
            artifacts/*.Install.*.exe
          if-no-files-found: error
          retention-days: 30
