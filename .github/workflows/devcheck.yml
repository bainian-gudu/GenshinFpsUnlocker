name: Devcheck

# 自动执行：push 到 main、任何 PR、以及手动触发。
# 这是「快速体检」工作流（tools/devcheck），几分钟内出结果；
# 完整的打包工作流 build.yml 仍然只手动触发（Windows + nightly + build-std，很慢）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcheck-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "9.0.x"
  NODE_VERSION: "22"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CARGO_TERM_COLOR: "always"
  # actions/setup-node 自己（以及它的 post-job 缓存步骤）会打 [DEP0040] punycode /
  # [DEP0169] url.parse() 弃用告警，是 action 内部依赖的事，跟本仓库无关。
  # env 对所有步骤（包括 node 类 action）都生效，所以在这里统一静音。
  NODE_NO_WARNINGS: "1"
  # 已是 runner 默认行为，留着只为显式声明；ilammy/msvc-dev-cmd@v1 仍声明 node20，
  # 日志里会有一条 ##[warning]Node.js 20 is deprecated，那是上游 action 的事。
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  devcheck:
    name: devcheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # ubuntu 验证脚本的跨平台分支；windows 验证用户实际会跑的那条路径
        # （Get-Tool 的 .cmd 解析、路径分隔符、dotnet 原生构建）
        os: [ubuntu-latest, windows-latest]

    steps:
      # actions/checkout 会先 git init，ubuntu 镜像上的 git 默认分支名还是 master，
      # 于是每次都要打 8 行 "hint: Using 'master' as the name for the initial branch..."。
      # 放在 checkout 之前设好默认分支名，日志里就干净了。
      - name: Silence git default-branch hint
        if: runner.os == 'Linux'
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # 两个 lockfile 都要缓存：devcheck 前端层 + Web UI 构建
          cache-dependency-path: |
            tools/devcheck/front/package-lock.json
            src/Ui/package-lock.json

      # windows-latest 的 MSVC 工具链自带该 target；ubuntu 需要显式安装
      - name: Install windows-msvc rust target
        if: runner.os == 'Linux'
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      # native 层要用 cl.exe 真编 vendored rcedit-sys 的 C++（rescle.cc / librcedit.cpp）。
      # 不注入 MSVC 开发环境时该层会自动 SKIP，不算失败。
      - name: Add MSVC Developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache cargo (devcheck crates)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/devcheck/rust/typecheck
            tools/devcheck/rust/logic
          cache-targets: true
          key: devcheck

      # vendor 层断言：kachina 只从本仓库的源码快照构建，工作流与打包脚本里
      # 没有任何从上游仓库拉源码 / 下二进制的动作（详见 tools/devcheck/README.md）。
      # 单独跑一次，让这条约束在日志里有独立、显眼的结论。
      # 注意：本文件的注释里不要写上游仓库名，vendor 层会扫工作流文件。
      - name: Vendored source guard
        shell: pwsh
        run: pwsh -NoProfile -File ./tools/devcheck/devcheck.ps1 -Layer vendor

      - name: devcheck (all layers)
        shell: pwsh
        run: pwsh -NoProfile -File ./tools/devcheck/devcheck.ps1

      # 自检：往生成物里注入 5 个错误，确认每一层真的会报错
      # （防止「检查跑通了但其实什么都没查」）
      - name: devcheck -SelfTest
        shell: pwsh
        run: pwsh -NoProfile -File ./tools/devcheck/devcheck.ps1 -SelfTest

      # Web UI 构建不在 all 里（要先 npm ci），这里单独跑；只在 ubuntu 上跑，省时间
      - name: Web UI build
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location src/Ui
          try { npm ci --no-audit --no-fund } finally { Pop-Location }
          pwsh -NoProfile -File ./tools/devcheck/devcheck.ps1 -Layer ui
